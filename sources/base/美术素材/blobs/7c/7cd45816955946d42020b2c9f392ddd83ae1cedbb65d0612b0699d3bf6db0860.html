<!doctype html>
<html lang="zh-CN">

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Draw Asset Preview</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #101114;
      color: #eceef2;
    }
    body {
      margin: 0;
      padding: 24px;
    }
    h1 {
      margin: 0 0 20px;
      font-size: 28px;
      font-weight: 700;
    }
    h2 {
      margin: 28px 0 12px;
      font-size: 18px;
      font-weight: 650;
      color: #b9d6ff;
    }
    .asset-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
      gap: 14px;
    }
    .asset-card {
      margin: 0;
      padding: 10px;
      border: 1px solid #2b3038;
      border-radius: 8px;
      background:
        linear-gradient(45deg, #242832 25%, transparent 25%),
        linear-gradient(-45deg, #242832 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #242832 75%),
        linear-gradient(-45deg, transparent 75%, #242832 75%);
      background-color: #181b21;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
      background-size: 16px 16px;
    }
    img {
      display: block;
      width: 100%;
      height: 128px;
      object-fit: contain;
      image-rendering: pixelated;
    }
    figcaption {
      margin-top: 8px;
      min-height: 34px;
      overflow-wrap: anywhere;
      font-size: 12px;
      line-height: 1.35;
      color: #d9dde6;
    }
  </style>
</head>
