name: I1 quick baseline

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: i1-quick-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bootstrap locked Godot toolchain
        shell: powershell
        run: >-
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File .\tools\i0\bootstrap_toolchain.ps1
          -WorkspaceRoot "${{ github.workspace }}"

      - name: Run I1 quick validation
        shell: powershell
        run: >-
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File .\tools\i1\invoke_i1.ps1
          -Profile quick
          -SourceMode worktree
          -GodotExe .\tools\runtimes\godot\4.6.3\Godot_v4.6.3-stable_win64_console.exe

      - name: Upload I1 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i1-quick-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            .tmp/i1/**/report.json
            .tmp/i1/**/logs/**
